<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Casino</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="casino-table">
    <div class="header">
      <h1>BLACKJACK</h1>
      <div class="bankroll-display">Bankroll: $<span id="bankroll">1000</span></div>
    </div>

    <div class="dealer-area">
      <div class="area-label">DEALER <span id="dealer-score" class="score"></span></div>
      <div class="cards" id="dealer-cards"></div>
    </div>

    <div class="table-center">
      <div class="message" id="message">Place your bet to deal!</div>
      <div class="pot">Current Bet: $<span id="current-bet">0</span></div>
    </div>

    <div class="player-area">
      <div class="area-label">PLAYER <span id="player-score" class="score"></span></div>
      <div class="cards" id="player-cards"></div>
    </div>

    <div class="controls">
      <div class="betting-controls" id="bet-controls">
        <button class="chip" data-amount="10">$10</button>
        <button class="chip" data-amount="25">$25</button>
        <button class="chip" data-amount="100">$100</button>
        <button class="chip" data-amount="500">$500</button>
        <button id="clear-bet-btn" class="btn btn-secondary">Clear</button>
        <button id="deal-btn" class="btn btn-primary" disabled>Deal</button>
      </div>

      <div class="action-controls hidden" id="action-controls">
        <button id="hit-btn" class="btn btn-action">Hit</button>
        <button id="stand-btn" class="btn btn-action">Stand</button>
        <button id="double-btn" class="btn btn-action">Double Down</button>
        <button id="surrender-btn" class="btn btn-secondary">Surrender</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
