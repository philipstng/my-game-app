    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: 'Inter', sans-serif;
            user-select: none;
            overflow: hidden;
        }

        .felt-table {
            background: radial-gradient(circle, #0e6b40 0%, #063d23 85%, #021f11 100%);
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.7), 0 20px 50px rgba(0,0,0,0.8);
            border: 12px solid #2d1800;
        }

        .card {
            width: 60px;
            height: 88px;
            perspective: 1000px;
            transition: transform 0.4s ease-out, opacity 0.3s ease;
            position: relative;
        }

        @media (min-width: 640px) {
            .card {
                width: 80px;
                height: 116px;
            }
        }

        @media (min-width: 768px) {
            .card {
                width: 96px;
                height: 140px;
            }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-front {
            background-color: #ffffff;
            color: #111;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
        }

        @media (min-width: 640px) {
            .card-front {
                padding: 6px;
            }
        }

        .card-back {
            background: repeating-linear-gradient(
                45deg,
                #b91c1c,
                #b91c1c 10px,
                #991b1b 10px,
                #991b1b 20px
            );
            border: 2px solid #ffffff;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-back::after {
            content: '♠♥♦♣';
            color: rgba(255,255,255,0.25);
            font-size: 14px;
            letter-spacing: 2px;
        }

        @media (min-width: 640px) {
            .card-back::after {
                font-size: 18px;
            }
        }

        @keyframes dealIn {
            0% {
                opacity: 0;
                transform: translateY(-120px) scale(0.5) rotate(-15deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        .deal-animation {
            animation: dealIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .chip {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px dashed #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 0 8px rgba(0,0,0,0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        @media (min-width: 640px) {
            .chip {
                width: 52px;
                height: 52px;
                font-size: 13px;
            }
        }

        @media (min-width: 768px) {
            .chip {
                width: 64px;
                height: 64px;
                font-size: 15px;
            }
        }

        .chip:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 12px rgba(0,0,0,0.5), inset 0 0 8px rgba(0,0,0,0.3);
        }

        .chip:active {
            transform: translateY(0) scale(0.96);
        }

        .chip-5 { background: radial-gradient(circle, #ef4444 60%, #991b1b 100%); color: white; }
        .chip-25 { background: radial-gradient(circle, #22c55e 60%, #15803d 100%); color: white; }
        .chip-100 { background: radial-gradient(circle, #3b82f6 60%, #1d4ed8 100%); color: white; }
        .chip-500 { background: radial-gradient(circle, #a855f7 60%, #6b21a8 100%); color: white; }

        .recommendation-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #374151;
            border-radius: 12px;
            padding: 8px 12px;
            backdrop-filter: blur(10px);
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #374151;
            border-radius: 12px;
            padding: 8px 12px;
            backdrop-filter: blur(10px);
        }

        @media (min-width: 768px) {
            .recommendation-box, .stats-box {
                padding: 12px 16px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        /* Mobile portrait layout adjustments */
        @media (max-width: 640px) and (orientation: portrait) {
            .mobile-portrait {

                min-height: 400px;
            }
            .mobile-portrait #dealerCards,
            .mobile-portrait #playerCards {
                min-height: 80px;
            }
        }
    </style>

            }
        }
